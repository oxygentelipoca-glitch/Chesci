[project]
name = "chemroute"
version = "0.2.0"
description = "ChemFinder — 化学合成路线智能分析系统"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "langchain>=1.3.14",
    "langchain-text-splitters>=1.1.2",
    "openai>=2.50.0",
    "pyjwt>=2.11,<3",
    "pymysql>=1.2.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "pdfplumber>=0.11.0",
    "ragas>=0.4.3",
    "datasets>=5.0.1",
    "sentence-transformers>=5.6.1",
    "sqlmodel>=0.0.39",
    "uvicorn>=0.52.0",
    "rank-bm25>=0.2.2",
    "neo4j>=6.0.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9,<3",
]
